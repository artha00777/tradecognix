# Render's free tier sleeps after ~15 idle minutes, and a sleeping API can't tick paper sessions.
# Ping /health every 10 minutes across NSE hours (08:30-16:20 IST, Mon-Fri). GitHub cron is UTC and can run a few minutes late.
name: Keep API awake in market hours

on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://tradecognix-api.onrender.com/health; then echo; exit 0; fi
            sleep 20
          done
          echo "API did not answer /health" && exit 1
